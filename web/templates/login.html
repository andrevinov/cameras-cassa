<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Câmeras da Casa</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#111;color:#eee;font-family:system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}
    main{width:min(420px,100%);background:#1c1c1c;border:1px solid #333;border-radius:12px;padding:24px}
    h1{margin:0 0 6px;font-size:24px} p{color:#aaa;margin:0 0 22px}
    label{display:block;margin:14px 0 6px;color:#ccc} input{width:100%;font:inherit;padding:12px;border-radius:7px;border:1px solid #555;background:#111;color:#fff}
    button{width:100%;margin-top:20px;padding:12px;border:1px solid #666;border-radius:7px;background:#eee;color:#111;font:inherit;font-weight:700;cursor:pointer}
    .error{margin-top:14px;padding:10px;border-radius:7px;background:#3b1717;color:#ffb8b8}
  </style>
</head>
<body>
<main>
  <h1>Câmeras da Casa</h1>
  <p>Acesso restrito à família.</p>
  <form method="post" action="/login" autocomplete="on">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="username">Usuário</label>
    <input id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">Senha</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Entrar</button>
  </form>
  {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
</main>
</body>
</html>
