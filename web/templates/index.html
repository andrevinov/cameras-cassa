<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Câmeras da Casa</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#111;color:#eee;font-family:system-ui,sans-serif}
    header{padding:14px 20px;background:#191919;border-bottom:1px solid #333;display:flex;align-items:center;justify-content:space-between;gap:16px}
    header h1{margin:0;font-size:22px} .account{display:flex;align-items:center;gap:12px;color:#aaa;font-size:14px}.account form{margin:0}
    main{max-width:1200px;margin:auto;padding:20px}.camera{background:#1c1c1c;border:1px solid #333;border-radius:10px;overflow:hidden}.camera h2{margin:0;padding:12px 16px;font-size:18px}
    iframe{display:block;width:100%;aspect-ratio:16/9;border:0;background:#000}.actions{display:flex;flex-wrap:wrap;gap:10px;padding:12px;align-items:center}
    button{min-height:42px;padding:8px 14px;border-radius:6px;border:1px solid #555;background:#292929;color:#fff;cursor:pointer}
    button:disabled{opacity:.45;cursor:not-allowed}#talkButton{touch-action:none}#talkButton.active{background:#8b241e;border-color:#c9534c}.volume{display:flex;align-items:center;gap:8px;color:#ccc}.volume input{width:150px}
    .status{padding:0 16px 14px;color:#aaa;font-size:13px}.logout{min-height:auto;padding:6px 10px}
  </style>
</head>
<body>
<header>
  <h1>Câmeras da Casa</h1>
  <div class="account"><span>{{ username }}</span><form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="logout" type="submit">Sair</button></form></div>
</header>
<main>
  <section class="camera">
    <h2>Câmera 1</h2>
    <iframe id="camera1" allow="autoplay" src="/go2rtc/webrtc.html?src=camera1-talk&media=video+audio"></iframe>
    <div class="actions">
      <button id="soundButton" type="button">🔇 Ligar som</button>
      <label class="volume">Volume <input id="volume" type="range" min="0" max="1" step="0.05" value="1"></label>
      <button id="talkButton" type="button" {% if not talk_enabled %}disabled title="Fala ainda não ativada neste servidor"{% endif %}>🎙 Segure para falar</button>
      <button id="reconnectButton" type="button">↻ Reconectar</button>
    </div>
    <div class="status" id="status">Online · vídeo + áudio</div>
    <div class="status" id="talkStatus" role="status" aria-live="polite"></div>
  </section>
</main>
<script>
const iframe=document.getElementById("camera1"),soundButton=document.getElementById("soundButton"),volume=document.getElementById("volume"),reconnectButton=document.getElementById("reconnectButton"),status=document.getElementById("status");
const talkButton=document.getElementById("talkButton"),talkStatus=document.getElementById("talkStatus"),talkCsrf={{ csrf|tojson }};
let soundEnabled=false;
function playerVideo(){try{return iframe.contentDocument?.getElementById("video")||null}catch(_){return null}}
function applyAudioState(){const video=playerVideo();if(!video)return;video.muted=!soundEnabled;video.volume=Number(volume.value);if(soundEnabled)video.play().catch(()=>{})}
iframe.addEventListener("load",()=>{applyAudioState();status.textContent="Online · vídeo + áudio"});
soundButton.addEventListener("click",()=>{soundEnabled=!soundEnabled;soundButton.textContent=soundEnabled?"🔊 Desligar som":"🔇 Ligar som";applyAudioState()});
volume.addEventListener("input",applyAudioState);
reconnectButton.addEventListener("click",()=>{iframe.src=iframe.src});

let talkSession=null;
function endTalk(){
  const session=talkSession;
  talkSession=null;
  talkButton.classList.remove("active");
  talkButton.setAttribute("aria-pressed","false");
  talkButton.textContent="🎙 Segure para falar";
  if(!session)return;
  try{if(session.socket?.readyState===WebSocket.OPEN)session.socket.send("stop")}catch(_){}
  try{session.socket?.close()}catch(_){}
  try{session.node?.disconnect()}catch(_){}
  try{session.source?.disconnect()}catch(_){}
  try{session.context?.close()}catch(_){}
  session.stream?.getTracks().forEach(track=>track.stop());
  if(talkStatus.textContent==="Falando…"||talkStatus.textContent==="Conectando fala…")talkStatus.textContent="Fala encerrada";
}
async function beginTalk(){
  if(talkSession||talkButton.disabled)return;
  const session={};
  talkSession=session;
  talkButton.classList.add("active");
  talkButton.setAttribute("aria-pressed","true");
  talkButton.textContent="🎙 Solte para parar";
  talkStatus.textContent="Conectando fala…";
  try{
    session.context=new AudioContext();
    await session.context.resume();
    if(talkSession!==session)return;
    session.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});
    if(talkSession!==session){session.stream.getTracks().forEach(track=>track.stop());return}
    const url=`${location.protocol==="https:"?"wss":"ws"}://${location.host}/talk/ws`;
    session.socket=new WebSocket(url);
    await new Promise((resolve,reject)=>{
      session.socket.onopen=()=>session.socket.send(talkCsrf);
      session.socket.onmessage=event=>{
        let message;try{message=JSON.parse(event.data)}catch(_){reject(new Error("Resposta de fala inválida"));return}
        if(message.ready)resolve();else if(message.error)reject(new Error(message.error));
      };
      session.socket.onerror=()=>reject(new Error("Não foi possível abrir a fala"));
      session.socket.onclose=()=>reject(new Error("Conexão de fala encerrada"));
    });
    if(talkSession!==session)return;
    session.socket.onclose=()=>{if(talkSession===session){endTalk();talkStatus.textContent="Conexão de fala encerrada"}};
    session.socket.onmessage=event=>{try{const message=JSON.parse(event.data);if(message.error){endTalk();talkStatus.textContent=message.error}}catch(_){}};
    await session.context.audioWorklet.addModule("/talk/processor.js");
    if(talkSession!==session)return;
    session.source=session.context.createMediaStreamSource(session.stream);
    session.node=new AudioWorkletNode(session.context,"camera-talk");
    const silent=session.context.createGain();silent.gain.value=0;
    session.source.connect(session.node);session.node.connect(silent);silent.connect(session.context.destination);
    session.node.port.onmessage=event=>{
      if(session.socket.readyState===WebSocket.OPEN&&session.socket.bufferedAmount<6400)session.socket.send(event.data);
    };
    if(talkSession===session)talkStatus.textContent="Falando…";
  }catch(error){
    if(talkSession===session){endTalk();talkStatus.textContent=error.message||"Falha ao iniciar fala"}
  }
}
if(!talkButton.disabled){
  talkButton.addEventListener("pointerdown",event=>{event.preventDefault();talkButton.setPointerCapture(event.pointerId);beginTalk()});
  talkButton.addEventListener("pointerup",endTalk);
  talkButton.addEventListener("pointercancel",endTalk);
  talkButton.addEventListener("lostpointercapture",endTalk);
  talkButton.addEventListener("keydown",event=>{if((event.key===" "||event.key==="Enter")&&!event.repeat){event.preventDefault();beginTalk()}});
  talkButton.addEventListener("keyup",event=>{if(event.key===" "||event.key==="Enter"){event.preventDefault();endTalk()}});
  window.addEventListener("pagehide",endTalk);
}
</script>
</body>
</html>
